# Bloc `server` charge dans /etc/nginx/conf.d/default.conf (nginx-unprivileged,
# ecoute sur 8080). Sert la SPA Vue et relaie /api et /socket.io vers le backend.

# Upgrade WebSocket (Socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;   # uploads CV / avatar / logo via /api

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- En-tetes de securite (repetes ici : un add_header dans un location
    #     remplacerait ceux du server ; on n'en met donc pas dans les location) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # img-src https: : avatars/logos servis depuis S3. connect-src 'self' couvre
    # /api et /socket.io (meme origine) ; ws:/wss: pour Socket.io.
    # Si l'API est sur une autre origine (VITE_API_URL absolue), l'ajouter ici.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS : a activer UNIQUEMENT derriere un TLS reel (reverse proxy / LB) :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Resolution DNS differee (resolveur interne de Docker) : nginx demarre meme
    # si le backend n'est pas encore pret. A adapter hors Docker Compose.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    # Sonde de sante du conteneur
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API REST (Swagger inclus : /api/docs). Regex : couvre aussi "/api" sans slash.
    # Les en-tetes de securite poses par Helmet cote backend sont masques pour
    # eviter les doublons : ce sont ceux de nginx (ci-dessus) qui font foi.
    location ~ ^/api(/|$) {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket Socket.io (namespace /chat)
    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assets Vite (noms haches) : cache long
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA : fallback vers index.html (jamais mis en cache)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
